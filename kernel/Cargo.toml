[package]
name = "kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
instrumented = []

[dependencies]
kernel-heap = { path = "../crates/heap" }
kernel-abi = { path = "../crates/abi" }
kernel-core = { path = "../crates/core-model" }
kernel-platform = { path = "../crates/platform" }
disk-format = { path = "../crates/disk-format" }
kernel-fs = { package = "filesystem", path = "../crates/filesystem" }

[[bin]]
name = "kernel"
path = "src/main.rs"
test = false
bench = false
